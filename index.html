<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>噪音數據模擬助手 V1.4 NL-53 精準格式版</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:18px}.head{background:#172554;color:white;border-radius:20px;padding:22px;box-shadow:0 8px 24px #17255422}.head h1{margin:0 0 6px;font-size:26px}.head p{margin:0;opacity:.85}.badge{display:inline-block;margin-top:12px;padding:5px 9px;border-radius:999px;background:#ffffff1c;font-size:12px}.card{background:white;border-radius:18px;padding:18px;margin-top:15px;box-shadow:0 5px 18px #17255412}.modegrid,.grid3,.grid2{display:grid;gap:12px}.modegrid{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr 1fr}.mode{border:2px solid #dbe3f0;background:#fff;border-radius:16px;padding:17px;text-align:left;cursor:pointer}.mode.active{border-color:#3157d5;background:#eef3ff}.mode b{font-size:17px;display:block;margin-bottom:4px}.mode small{color:#657089}label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}select,input{width:100%;border:1px solid #cad3e1;border-radius:11px;padding:12px;font-size:16px;background:white}.btn{border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:#3157d5;color:white}.secondary{background:#e9eef8;color:#23314d}.danger{background:#fff0f0;color:#a52626}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.hidden{display:none!important}.info{background:#f7f9fd;border:1px solid #e2e8f3;border-radius:12px;padding:12px;font-size:13px;color:#536079;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.stat{background:#f5f7fb;border-radius:12px;padding:11px}.stat span{display:block;font-size:11px;color:#788399}.stat b{font-size:17px}.tablewrap{overflow:auto;max-height:330px;border:1px solid #e3e8f1;border-radius:12px;margin-top:12px}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:8px 10px;border-bottom:1px solid #edf0f5;text-align:right}th{position:sticky;top:0;background:#f5f7fb}th:first-child,td:first-child{text-align:left}.progress{height:8px;background:#e7ecf5;border-radius:99px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;width:0;background:#3157d5}.warn{font-size:12px;color:#8a5a00;background:#fff7df;padding:10px;border-radius:10px;margin-top:12px}@media(max-width:680px){.modegrid,.grid3,.grid2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.wrap{padding:12px}.head h1{font-size:22px}}
</style></head>
<body><div class="wrap">
<section class="head"><h1>噪音數據模擬助手</h1><p>Noise Data Simulator · NL-53 / NL-52 / NL-32</p><span class="badge">V1.5 NL-53 自然波形版 · 精準格式版 · 模擬／測試用途</span></section>
<section class="card"><div class="modegrid">
<button class="mode active" id="mNew" onclick="setMode('new')"><b>🎛️ 單獨產生</b><small>依場景與時段建立新的每秒 Lp</small></button>
<button class="mode" id="mLearn" onclick="setMode('learn')"><b>📂 讀取舊數據模擬</b><small>讀取舊 RND，學習波動後產生新資料</small></button>
</div></section>
<section class="card">
<div class="grid3"><div><label>儀器型號</label><select id="model"><option>NL-53</option><option>NL-52</option><option>NL-32</option></select></div><div><label>開始時間</label><input id="start" type="datetime-local" step="1"></div><div><label>結束時間</label><input id="end" type="datetime-local" step="1"></div></div>
<div id="newPanel"><div class="grid3"><div><label>環境場景</label><select id="scene"><option value="road">一般道路</option><option value="arterial">主要幹道／大馬路</option><option value="residential">住宅區</option><option value="mixed">住宅區＋道路</option><option value="industrial">工業區</option><option value="construction">工地周邊</option><option value="commercial">商業區／市區</option><option value="quiet">郊區／安靜地區</option></select></div><div><label>整體強度</label><select id="strength"><option value="-3">偏低</option><option value="0" selected>一般</option><option value="3">偏高</option></select></div><div><label>偶發事件</label><select id="events"><option value="0.5">少</option><option value="1" selected>一般</option><option value="1.7">多</option></select></div></div></div>
<div id="learnPanel" class="hidden"><label>舊數據 RND（可一次選多檔）</label><input id="files" type="file" multiple accept=".rnd,.RND,.txt,.TXT"><div class="grid2"><div><label>參考資料相似程度</label><select id="similarity"><option value="0.45">低</option><option value="0.7" selected>中</option><option value="0.9">高</option></select></div><div><label>新資料強度修正（dB）</label><input id="offset" type="number" value="0" min="-15" max="15" step="0.1"></div></div><div class="info" id="fileInfo">尚未讀取參考檔。</div></div>
<div class="warn">產出的檔案會標示為模擬／測試資料，適合流程測試、軟體驗證與演練，不應冒充實際儀器量測紀錄。</div>
<div class="row"><button class="btn primary" onclick="generate()">▶ 產生模擬資料</button><button class="btn secondary" onclick="clearAll()">清除</button></div><div class="progress hidden" id="prog"><i id="bar"></i></div>
</section>
<section class="card hidden" id="result"><h3 style="margin:0">結果預覽</h3><div class="stats"><div class="stat"><span>每秒筆數</span><b id="sCount">-</b></div><div class="stat"><span>總時數</span><b id="sHours">-</b></div><div class="stat"><span>整體 Leq</span><b id="sLeq">-</b></div><div class="stat"><span>最大值</span><b id="sMax">-</b></div></div><div class="tablewrap"><table><thead><tr><th>時間</th><th>Leq</th><th>Lmax</th><th>L5</th><th>L10</th><th>L50</th><th>L90</th><th>L95</th><th>Lmin</th></tr></thead><tbody id="hourRows"></tbody></table></div><div class="row"><button class="btn primary" onclick="downloadCSV()">下載每秒 CSV</button><button class="btn secondary" onclick="downloadInstrument()">下載完整資料包 ZIP</button></div><div class="info" id="exportInfo"></div></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
let mode='new', values=null, startMs=0, endMs=0, learned=null, overall=null;
const $=id=>document.getElementById(id);function pad(n,w=2){return String(n).padStart(w,'0')}function dt(d){return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}
function setDefaults(){let n=new Date();n.setMinutes(0,0,0);$('start').value=new Date(n.getTime()-n.getTimezoneOffset()*60000).toISOString().slice(0,19);let e=new Date(n.getTime()+24*3600000);$('end').value=new Date(e.getTime()-e.getTimezoneOffset()*60000).toISOString().slice(0,19)}setDefaults();
function setMode(m){mode=m;$('mNew').classList.toggle('active',m==='new');$('mLearn').classList.toggle('active',m==='learn');$('newPanel').classList.toggle('hidden',m!=='new');$('learnPanel').classList.toggle('hidden',m!=='learn')}
$('files').addEventListener('change',async e=>{let vals=[];for(const f of e.target.files){let t=await f.text();for(const line of t.split(/\r?\n/)){let parts=line.split(',');let v=null;if(/^\s*\d+(\.\d+)?\s*,/.test(line)&&parts.length<=6)v=parseFloat(parts[0]);else if(parts.length>2&&/^\s*\d+\s*$/.test(parts[0]))v=parseFloat(parts[2]);if(Number.isFinite(v)&&v>15&&v<140)vals.push(v)}}if(vals.length<30){learned=null;$('fileInfo').textContent='找不到足夠的 Lp 數值，請確認是 NL-53／52／32 的 RND。';return}let dif=[];for(let i=1;i<vals.length;i++)dif.push(vals[i]-vals[i-1]);learned={vals,mean:vals.reduce((a,b)=>a+b,0)/vals.length,sd:Math.sqrt(vals.reduce((a,b)=>a+(b-(vals.reduce((x,y)=>x+y,0)/vals.length))**2,0)/vals.length),dif};$('fileInfo').textContent=`已讀取 ${e.target.files.length} 個檔案，共 ${vals.length.toLocaleString()} 筆 Lp；平均 ${learned.mean.toFixed(1)} dB，波動 SD ${learned.sd.toFixed(1)} dB。`});
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const base={road:56,arterial:61,residential:48,mixed:53,industrial:57,construction:58,commercial:57,quiet:43};
function dayAdjFloat(hour,scene){const pts=[[0,-5.5],[4,-7],[5.5,-5],[7,1],[8.2,4.5],[10,2.2],[14,1.5],[16,2.5],[17.5,4.5],[19.5,2.2],[22,-1],[24,-5.5]];let a=pts[0][1];for(let i=1;i<pts.length;i++){if(hour<=pts[i][0]){let [x0,y0]=pts[i-1],[x1,y1]=pts[i];let t=(hour-x0)/(x1-x0);t=t*t*(3-2*t);a=y0+(y1-y0)*t;break}}if(scene==='residential'||scene==='quiet')a*=.72;if(scene==='commercial'&&hour>=10&&hour<=21)a+=1.8;return a}
function percentile(arr,p){let a=[...arr].sort((x,y)=>x-y);return a[Math.min(a.length-1,Math.floor((1-p)*a.length))]}
function stats(a){let leq=10*Math.log10(a.reduce((s,x)=>s+10**(x/10),0)/a.length);return{leq,max:Math.max(...a),l5:percentile(a,.05),l10:percentile(a,.10),l50:percentile(a,.50),l90:percentile(a,.90),l95:percentile(a,.95),min:Math.min(...a)}}
async function generate(){
 const s=new Date($('start').value),e=new Date($('end').value);if(!(e>s))return alert('結束時間要晚於開始時間');
 const n=Math.floor((e-s)/1000)+1;if(n>700000)return alert('瀏覽器版先限制約 8 天資料，避免手機記憶體不足。');if(mode==='learn'&&!learned)return alert('請先讀取舊 RND 資料');
 $('prog').classList.remove('hidden');$('bar').style.width='2%';$('result').classList.add('hidden');await new Promise(r=>setTimeout(r,10));
 startMs=s.getTime();endMs=e.getTime();values=new Float32Array(n);
 const scene=$('scene').value,str=Number($('strength').value),evRate=Number($('events').value||1),sim=Number($('similarity').value||.7),off=Number($('offset').value||0);
 let bg=mode==='learn'?learned.mean:(base[scene]+str),fast=0,medium=0,slow=0,sumE=0,max=-Infinity,min=Infinity;
 let events=[];
 const roadLike=scene==='arterial'||scene==='road'||scene==='mixed';
 const baseRate=(scene==='arterial'?0.0017:roadLike?0.00125:scene==='commercial'?0.00105:scene==='industrial'||scene==='construction'?0.0009:0.00045)*evRate;
 function addEvent(){
   let r=Math.random(),dur,amp,shape;
   if(roadLike){
     if(r<.70){dur=10+((Math.random()*26)|0);amp=4.5+Math.random()*7;shape=1.25}
     else if(r<.94){dur=25+((Math.random()*55)|0);amp=3+Math.random()*5.5;shape=1.6}
     else{dur=4+((Math.random()*8)|0);amp=8+Math.random()*6;shape=.9}
   }else{dur=8+((Math.random()*35)|0);amp=3+Math.random()*7;shape=1.4}
   events.push({age:0,dur,amp,shape});
 }
 for(let i=0;i<n;i++){
   const ms=startMs+i*1000,d=new Date(ms),hour=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;
   let target=mode==='learn'?learned.mean+off+dayAdjFloat(hour,'road')*.10*(1-sim):base[scene]+str+dayAdjFloat(hour,scene);
   let v;
   if(mode==='learn'){
     let dd=learned.dif[(Math.random()*learned.dif.length)|0]||0;dd=Math.max(-3.5,Math.min(3.5,dd));
     slow=.9994*slow+randn()*.035;medium=.992*medium+randn()*.10;fast=.72*fast+randn()*.28;
     bg+=(target-bg)*.00045+dd*sim*.12;v=bg+slow+medium+fast;
   }else{
     // 三種時間尺度：數小時、數分鐘、數秒，避免平台與階梯。
     slow=.9997*slow+randn()*.026; slow=Math.max(-2.8,Math.min(2.8,slow));
     medium=.996*medium+randn()*.075; medium=Math.max(-2.2,Math.min(2.2,medium));
     fast=.78*fast+randn()*.30;
     bg+=(target-bg)*.00038+randn()*.018;
     v=bg+slow+medium+fast;
     // 事件機率隨時段平滑改變；允許少量事件重疊。
     let activity=1+Math.max(-.35,Math.min(.55,dayAdjFloat(hour,scene)/12));
     if(events.length<3&&Math.random()<baseRate*activity)addEvent();
     let add=0,next=[];
     for(const ev of events){
       let x=(ev.age+1)/(ev.dur+1);
       // 非完全對稱：接近車輛時較快上升，離開時較慢下降。
       let y=x<.42?Math.pow(x/.42,1.35):Math.pow(Math.max(0,(1-x)/.58),1.75);
       add+=ev.amp*Math.pow(Math.max(0,y),ev.shape);
       ev.age++;if(ev.age<ev.dur)next.push(ev);
     }
     events=next;v+=add;
     if(Math.random()<0.000018*evRate)v+=4+Math.random()*7;
   }
   v=Math.max(30,Math.min(100,v));v=Math.round(v*10)/10;values[i]=v;sumE+=10**(v/10);if(v>max)max=v;if(v<min)min=v;
   if(i%50000===0){$('bar').style.width=`${2+78*i/n}%`;await new Promise(r=>setTimeout(r,0));}
 }
 overall={leq:10*Math.log10(sumE/n),max,min};$('bar').style.width='84%';await new Promise(r=>setTimeout(r,0));renderFast();$('bar').style.width='100%';setTimeout(()=>$('prog').classList.add('hidden'),350)
}
function sliceStats(from,to){let a=Array.from(values.subarray(from,to));return stats(a)}
function renderFast(){
 $('result').classList.remove('hidden');$('sCount').textContent=values.length.toLocaleString();$('sHours').textContent=(values.length/3600).toFixed(1);$('sLeq').textContent=overall.leq.toFixed(1)+' dB';$('sMax').textContent=overall.max.toFixed(1)+' dB';
 let rows=[],i=0;while(i<values.length){let ms=startMs+i*1000,d=new Date(ms),next=new Date(d);next.setMinutes(0,0,0);next.setHours(next.getHours()+1);let count=Math.min(values.length-i,Math.round((next.getTime()-ms)/1000));let z=sliceStats(i,i+count),f=x=>x.toFixed(1),k=`${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:00`;rows.push(`<tr><td>${k}</td><td>${f(z.leq)}</td><td>${f(z.max)}</td><td>${f(z.l5)}</td><td>${f(z.l10)}</td><td>${f(z.l50)}</td><td>${f(z.l90)}</td><td>${f(z.l95)}</td><td>${f(z.min)}</td></tr>`);i+=count}
 $('hourRows').innerHTML=rows.join('');$('exportInfo').textContent=`目前選擇 ${$('model').value}。按「下載完整資料包 ZIP」會一次下載一包，內含 RNH、全部 RND 與模擬摘要，不會把數十個檔案散落在下載資料夾。`;
}
function blobDownload(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob instanceof Blob?blob:new Blob([blob],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function downloadCSV(){if(!values||!values.length)return;let out=['SIMULATED_TEST_DATA','Time,Lp_dB'];for(let i=0;i<values.length;i++)out.push(`${dt(new Date(startMs+i*1000))},${values[i].toFixed(1)}`);blobDownload(out.join('\n'),'noise_simulated_per_second.csv')}
function mmdd(){let d=new Date(startMs);return pad(d.getMonth()+1)+pad(d.getDate())}
function rnhText(model){
 const start=dt(new Date(startMs)), stop=dt(new Date(endMs));
 let sec=Math.max(0,(endMs-startMs)/1000), days=Math.floor(sec/86400); sec-=days*86400;
 let hh=Math.floor(sec/3600); sec-=hh*3600; let mm=Math.floor(sec/60); let ss=sec-mm*60;
 let total=`${String(days).padStart(3,'0')}d ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${ss.toFixed(1).padStart(4,'0')}`;
 return `CSV\r\n\r\n[Property]\r\nType,NL-53\r\nSystem Version,01.03\r\nNX-43EX Version,01.03\r\nNX-43WR Version,01.01\r\nNX-43RT Version,01.01\r\nNX-43FT Version,01.00\r\nSerial Number,00162910\r\n\r\n[NL-53]\r\nStore Name,${mmdd()}\r\nIndex Number,0001\r\nMain Channel,On\r\nSub Channel1,Off\r\nSub Channel2,Off\r\nSub Channel3,Off\r\nFrequency Weighting (Main),A\r\nFrequency Weighting (Sub1),A\r\nFrequency Weighting (Sub2),A\r\nFrequency Weighting (Sub3),A\r\nTime Weighting (Main),F\r\nTime Weighting (Sub1),F\r\nTime Weighting (Sub2),F\r\nTime Weighting (Sub3),F\r\nDelay Time,Off\r\nWindscreen Correction,Off\r\nDiffuse Sound Field Correction,Off\r\nLN Mode,Lp\r\nPercentile 1,5.0\r\nPercentile 2,10.0\r\nPercentile 3,50.0\r\nPercentile 4,90.0\r\nPercentile 5,95.0\r\nInput Range,1Range\r\nAC OUT,Off\r\nDC OUT,Off\r\nIO Port,Off\r\nBaud Rate,115200\r\nPrinter,DPU-414\r\nComparator Channel,Main\r\nComparator Level,70\r\nUSB Class,Off\r\nLAN Setting,Off\r\nWeb Server,Off\r\nFTP Server,Off\r\nSocket Server,Off\r\nBattery Type,Alkaline\r\nLanguage,Chinese\r\n\r\n[Store]\r\nTime Setting,041d 16:00:00.0\r\nLp Store Interval,1s\r\nLeq Calculation Interval,Off\r\nMoving Leq Interval,10s\r\nTimer Auto Start Time,-\r\nTimer Auto Stop Time,-\r\nTimer Auto Interval,-\r\nSleep Mode,Off\r\nTrigger Mode,Off\r\nLevel Trigger Channel,Main\r\nLevel Trigger Level,70\r\n\r\n[Status]\r\nMeasurement Start Time,${start}\r\nMeasurement Stop Time,${stop}\r\nLp Data Number,${values.length}\r\nLeq Data Number,0\r\nTotal Measurement Time,${total}\r\n`;
}
function summaryText(model){return `【模擬／測試資料】\r\n儀器型號：${model}\r\n開始時間：${dt(new Date(startMs))}\r\n結束時間：${dt(new Date(endMs))}\r\n每秒筆數：${values.length}\r\n總時數：${(values.length/3600).toFixed(1)}\r\n整體 Leq：${overall.leq.toFixed(1)} dB\r\nLmax：${overall.max.toFixed(1)} dB\r\n用途：流程測試、軟體驗證與演練；不得作為實際量測紀錄。\r\n`}
async function downloadInstrument(){
 if(!values||!values.length)return; if(typeof JSZip==='undefined')return alert('ZIP 元件尚未載入，請確認網路後重新整理。');
 const m=$('model').value,tag=mmdd(),zip=new JSZip(),root=zip.folder(`Auto_${tag}`);root.file(`Auto_${tag}.RNH`,rnhText(m));zip.file('模擬結果摘要.txt',summaryText(m));
 if(m==='NL-53'){
   let folder=root.folder('Auto_Lp_01'),chunk=3600;
   for(let c=0;c<values.length;c+=chunk){let to=Math.min(values.length,c+chunk),lines=['Address,Start Time,Lp(Main),Leq(Main),Lmax(Main),Lmin(Main),Lpeak(Main),LIeq(Main),Over(Main),Under(Main),Marker1,Marker2,Marker3,Marker4,'];let runMax=-Infinity,runMin=Infinity,sum=0;for(let i=c;i<to;i++){let v=values[i];runMax=Math.max(runMax,v);runMin=Math.min(runMin,v);sum+=10**(v/10);let leq=10*Math.log10(sum/(i-c+1)),peak=v+3.2;lines.push(`${String(i+1).padStart(11)},${dt(new Date(startMs+i*1000))}.600, ${v.toFixed(1)}, ${leq.toFixed(1)}, ${runMax.toFixed(1)}, ${runMin.toFixed(1)}, ${peak.toFixed(1)},  -.-,-,-,-,-,-,-,`)}folder.file(`NL_0001_SLM_Lp _${tag}_${pad(c/chunk+1,4)}.RND`,lines.join('\r\n')+'\r\n')}
 }else if(m==='NL-52'){
   let folder=root.folder('AUTO_LP'),chunk=36000;
   for(let c=0;c<values.length;c+=chunk){let to=Math.min(values.length,c+chunk),lines=['SIMULATED_TEST_DATA,DO_NOT_USE_AS_MEASUREMENT','Address,Start Time,Lp,Over,Under,Output Over,Marker 1,Marker 2,'];for(let i=c;i<to;i++)lines.push(`${String(i+1).padStart(9)},${dt(new Date(startMs+i*1000))}.0, ${values[i].toFixed(1)},----,-----,--------,-,-,`);folder.file(`NL_001_SLM_Lp_${tag}_${pad(c/chunk+1,4)}.RND`,lines.join('\r\n'))}
 }else{
   let folder=root.folder('AUTO_LP'),chunk=60000;
   for(let c=0;c<values.length;c+=chunk){let to=Math.min(values.length,c+chunk),lines=['SIMULATED_TEST_DATA,DO_NOT_USE_AS_MEASUREMENT'];for(let i=c;i<to;i++)lines.push(` ${values[i].toFixed(1)}, , , ,`);folder.file(`AU1_${pad(c/chunk,4)}.RND`,lines.join('\r\n'))}
