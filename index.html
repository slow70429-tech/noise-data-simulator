e-space:nowrap}th,td{padding:8px 10px;border-bottom:1px solid #edf0f5;text-align:right}th{position:sticky;top:0;background:#f5f7fb}th:first-child,td:first-child{text-align:left}.progress{height:8px;background:#e7ecf5;border-radius:99px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;width:0;background:#3157d5}.warn{font-size:12px;color:#8a5a00;background:#fff7df;padding:10px;border-radius:10px;margin-top:12px}@media(max-width:680px){.modegrid,.grid3,.grid2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.wrap{padding:12px}.head h1{font-size:22px}}

<body><div class="wrap">
<section class="head"><h1>噪音數據模擬助手</h1><p>Noise Data Simulator · NL-53 / NL-52 / NL-32</p><span class="badge">V2.5 · NL-53 功能鎖定／NL-52 舊數據自然波形優化 · 模擬／測試用途</span></section>
<section class="card"><div class="modegrid">
<button class="mode active" id="mNew" onclick="setMode('new')"><b>🎛️ 單獨產生</b><small>依場景與時段建立新的每秒 Lp</small></button>
<button class="mode" id="mLearn" onclick="setMode('learn')"><b>📂 讀取舊數據模擬</b><small>讀取舊 RND，學習波動後產生新資料</small></button>
</div></section>
<section class="card">
<div class="grid3"><div><label>儀器型號</label><select id="model"><option>NL-53</option><option>NL-52</option><option>NL-32</option></select></div><div><label>開始時間</label><input id="start" type="datetime-local" step="1"></div><div><label>結束時間</label><input id="end" type="datetime-local" step="1"></div></div>
<div id="newPanel"><div class="grid3"><div><label>環境場景</label><select id="scene"><option value="road">一般道路</option><option value="arterial">主要幹道／大馬路</option><option value="rail">高鐵／鐵路旁</option><option value="residential">住宅區</option><option value="mixed">住宅區＋道路</option><option value="industrial">工業區</option><option value="construction">工地周邊</option><option value="commercial">商業區／市區</option><option value="quiet">郊區／安靜地區</option></select></div><div><label>整體強度</label><select id="strength"><option value="-3">偏低</option><option value="0" selected>一般</option><option value="3">偏高</option></select></div><div><label>偶發事件</label><select id="events"><option value="0.5">少</option><option value="1" selected>一般</option><option value="1.7">多</option></select></div></div></div>
<div id="learnPanel" class="hidden"><label>舊數據 RND（可一次選多檔）</label><input id="files" type="file" multiple accept=".rnd,.RND,.txt,.TXT"><div class="grid2"><div><label>參考資料相似程度</label><select id="similarity"><option value="0.45">低</option><option value="0.7" selected>中</option><option value="0.9">高</option></select></div><div><label>新資料強度修正（dB）</label><input id="offset" type="number" value="0" min="-15" max="15" step="0.1"></div></div><div class="info" id="fileInfo">尚未讀取參考檔。</div><div id="learnStats" class="stats hidden"><div class="stat"><span>有效檔案</span><b id="lFiles">-</b></div><div class="stat"><span>有效 Lp</span><b id="lCount">-</b></div><div class="stat"><span>Min / Max</span><b id="lRange">-</b></div><div class="stat"><span>波動 SD</span><b id="lSd">-</b></div></div><div id="waveBox" class="hidden" style="margin-top:12px"><label>舊資料波形縮圖</label><canvas id="waveCanvas" width="900" height="150" style="width:100%;height:150px;border:1px solid #e3e8f1;border-radius:12px;background:#fafbfe"></canvas></div></div>
<div class="warn">產出的檔案會標示為模擬／測試資料，適合流程測試、軟體驗證與演練，不應冒充實際儀器量測紀錄。</div>
<div class="row"><button class="btn primary" id="generateBtn" onclick="generate()">▶ 產生模擬資料</button><button class="btn secondary" onclick="clearAll()">清除</button></div><div class="progress hidden" id="prog"><i id="bar"></i></div>
</section>
<section class="card hidden" id="result"><h3 style="margin:0">結果預覽</h3><div class="stats"><div class="stat"><span>每秒筆數</span><b id="sCount">-</b></div><div class="stat"><span>總時數</span><b id="sHours">-</b></div><div class="stat"><span>整體 Leq</span><b id="sLeq">-</b></div><div class="stat"><span>最大值</span><b id="sMax">-</b></div></div><div class="tablewrap"><table><thead><tr><th>時間</th><th>Leq</th><th>Lmax</th><th>L5</th><th>L10</th><th>L50</th><th>L90</th><th>L95</th><th>Lmin</th></tr></thead><tbody id="hourRows"></tbody></table></div><div class="row"><button class="btn primary" onclick="downloadCSV()">下載每秒 CSV</button><button class="btn secondary" onclick="downloadInstrument()">下載完整資料包 ZIP</button></div><div class="info" id="exportInfo"></div></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
let mode='new', values=null, startMs=0, endMs=0, learned=null, overall=null, readingFiles=false;
const $=id=>document.getElementById(id);function pad(n,w=2){return String(n).padStart(w,'0')}function dt(d){return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}
function localDT(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,19)}
let endManuallyEdited=false;
function setDefaults(){let n=new Date();n.setMinutes(0,0,0);$('start').value=localDT(n);let e=new Date(n.getTime()+72*3600000);$('end').value=localDT(e)}
setDefaults();
$('end').addEventListener('input',()=>endManuallyEdited=true);
$('start').addEventListener('change',()=>{if(!endManuallyEdited){let ss=new Date($('start').value);if(!isNaN(ss)){let ee=new Date(ss.getTime()+72*3600000);$('end').value=localDT(ee)}}});
function updateGenerateState(){let b=$('generateBtn');b.disabled=(mode==='learn'&&(readingFiles||!learned));b.style.opacity=b.disabled?'.45':'1';b.style.cursor=b.disabled?'not-allowed':'pointer'}
function setMode(m){mode=m;$('mNew').classList.toggle('active',m==='new');$('mLearn').classList.toggle('active',m==='learn');$('newPanel').classList.toggle('hidden',m!=='new');$('learnPanel').classList.toggle('hidden',m!=='learn');updateGenerateState()}
function drawLearnWave(vals){let c=$('waveCanvas'),x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);if(!vals.length)return;let mn=Infinity,mx=-Infinity;for(let v of vals){if(v<mn)mn=v;if(v>mx)mx=v}let bins=Math.min(w,vals.length),step=vals.length/bins;x.beginPath();for(let j=0;j<bins;j++){let a=Math.floor(j*step),b=Math.max(a+1,Math.floor((j+1)*step)),sum=0;for(let k=a;k<b;k++)sum+=vals[k];let v=sum/(b-a),yy=h-10-(v-mn)/Math.max(1,mx-mn)*(h-20),xx=j/(bins-1)*w;if(j===0)x.moveTo(xx,yy);else x.lineTo(xx,yy)}x.strokeStyle='#3157d5';x.lineWidth=1.4;x.stroke()}
updateGenerateState();
$('model').addEventListener('change',()=>{
  learned=null; readingFiles=false; $('files').value='';
  $('fileInfo').textContent=`目前儀器：${$('model').value}｜請重新選取此儀器的舊 RND。`;
  $('learnStats').classList.add('hidden'); $('waveBox').classList.add('hidden');
  updateGenerateState();
});
$('files').addEventListener('change',async e=>{
 const fs=[...(e.target.files||[])]; if(!fs.length)return;
 readingFiles=true;learned=null;updateGenerateState();$('learnStats').classList.add('hidden');$('waveBox').classList.add('hidden');
 // V2.3: 不再建立數十萬個 {time,value} 物件，也不做全資料排序。
 // RND 依使用者選取順序逐檔、逐行讀取；只保留 Float32 Lp + Uint8 小時，記憶體大幅降低。
 let chunks=[],hourChunks=[],bad=0,total=0,sum=0,sum2=0,mn=Infinity,mx=-Infinity,firstTm=null,lastTm=null;
 let hourSum=Array(24).fill(0),hourN=Array(24).fill(0);
 $('fileInfo').textContent=`步驟 1/3｜讀取 RND：0/${fs.length}`;
 for(let fi=0;fi<fs.length;fi++){
   const f=fs[fi],t=await f.text(), vv=[],hh=[]; let found=0;
   const lines=t.split(/\r?\n/);
   for(let li=0;li<lines.length;li++){
     const line=lines[li]; if(!line)continue;
     let parts=line.split(','),v=null,tm=null;
     if(/^\s*\d+(\.\d+)?\s*,/.test(line)&&parts.length<=6)v=parseFloat(parts[0]);
     else if(parts.length>2&&/^\s*\d+\s*$/.test(parts[0]))v=parseFloat(parts[2]);
     else{for(let k=parts.length-1;k>=0;k--){let z=parseFloat(parts[k]);if(Number.isFinite(z)&&z>15&&z<140){v=z;break}}}
     for(const p of parts){if(/^\s*\d{4}[\/-]\d{1,2}[\/-]\d{1,2}/.test(p)){let x=Date.parse(p.trim().replace(/\//g,'-'));if(Number.isFinite(x)){tm=x;break}}}
     if(Number.isFinite(v)&&v>15&&v<140){
       found++; total++; vv.push(v); sum+=v; sum2+=v*v; if(v<mn)mn=v;if(v>mx)mx=v;
       let h=tm!==null?new Date(tm).getHours():Math.floor(((total-1)%86400)/3600); hh.push(h); hourSum[h]+=v;hourN[h]++;
       if(tm!==null){if(firstTm===null||tm<firstTm)firstTm=tm;if(lastTm===null||tm>lastTm)lastTm=tm}
     }
   }
   if(found){
     if($('model').value==='NL-52' && vv.length){
       // NL-52: ignore only contiguous calibration values at the beginning/end (~94 dB).
       // Normal environmental peaks in the middle are preserved.
       let cutA=0,cutB=vv.length;
       while(cutA<Math.min(vv.length,120) && vv[cutA]>=93.0 && vv[cutA]<=95.0)cutA++;
       let tail=0;while(tail<Math.min(vv.length-cutA,120) && vv[vv.length-1-tail]>=93.0 && vv[vv.length-1-tail]<=95.0)tail++;
       if(cutA||tail){
         // Undo statistics accumulated for stripped calibration points.
         for(let q=0;q<cutA;q++){let v=vv[q],h=hh[q];total--;sum-=v;sum2-=v*v;hourSum[h]-=v;hourN[h]--}
         for(let q=vv.length-tail;q<vv.length;q++){let v=vv[q],h=hh[q];total--;sum-=v;sum2-=v*v;hourSum[h]-=v;hourN[h]--}
         cutB=vv.length-tail; vv.splice(cutB); hh.splice(cutB); vv.splice(0,cutA); hh.splice(0,cutA);
       }
     }
     if(vv.length){chunks.push(Float32Array.from(vv));hourChunks.push(Uint8Array.from(hh))}else bad++;
   }else bad++;
   $('fileInfo').textContent=`步驟 1/3｜讀取 ${$('model').value} RND：${fi+1}/${fs.length}｜${total.toLocaleString()} 筆 Lp`;
   await new Promise(r=>setTimeout(r,0));
 }
 if(total<30){readingFiles=false;learned=null;updateGenerateState();$('fileInfo').textContent='找不到足夠的 Lp 數值，請確認是 NL-53／52／32 的 RND。';return}
 $('fileInfo').textContent=`步驟 2/3｜建立日夜模型… ${total.toLocaleString()} 筆`;
 await new Promise(r=>setTimeout(r,20));
 const mean=sum/total,sd=Math.sqrt(Math.max(0,sum2/total-mean*mean));
 let hourProfile=Array(24).fill(mean);for(let h=0;h<24;h++)if(hourN[h])hourProfile[h]=hourSum[h]/hourN[h];
 // 紋理庫最多約 120,000 點，均勻抽樣；生成時只需要真實短期波動，不需要複製全部舊資料。
 const textureN=Math.min(120000,total),residuals=new Float32Array(textureN),previewN=Math.min(12000,total),preview=new Float32Array(previewN);
 let global=0,ti=0,pi=0,nextT=0,nextP=0,tStep=total/textureN,pStep=total/previewN;
 for(let ci=0;ci<chunks.length;ci++){
   const a=chunks[ci],hs=hourChunks[ci];
   for(let j=0;j<a.length;j++,global++){
     if(global>=nextT&&ti<textureN){residuals[ti++]=a[j]-hourProfile[hs[j]];nextT=(ti+1)*tStep}
     if(global>=nextP&&pi<previewN){preview[pi++]=a[j];nextP=(pi+1)*pStep}
   }
   if((ci&3)===0)await new Promise(r=>setTimeout(r,0));
 }
 $('fileInfo').textContent='步驟 3/3｜完成波形模型…'; await new Promise(r=>setTimeout(r,20));
 learned={mean,sd,hourProfile,residuals,min:mn,max:mx,count:total};
 let range='';if(firstTm!==null&&lastTm!==null){let fmt=x=>new Date(x).toLocaleString('zh-TW',{hour12:false});range=`｜${fmt(firstTm)} ～ ${fmt(lastTm)}`}
 $('fileInfo').textContent=`完成：${$('model').value}｜已讀取 ${fs.length-bad}/${fs.length} 個檔案｜${total.toLocaleString()} 筆 Lp｜約 ${(total/3600).toFixed(1)} 小時｜平均 ${mean.toFixed(1)} dB${range}${bad?`｜${bad} 檔無有效資料`:''}`;
 $('lFiles').textContent=`${fs.length-bad}/${fs.length}`;$('lCount').textContent=total.toLocaleString();$('lRange').textContent=`${mn.toFixed(1)} / ${mx.toFixed(1)}`;$('lSd').textContent=sd.toFixed(1)+' dB';$('learnStats').classList.remove('hidden');$('waveBox').classList.remove('hidden');drawLearnWave(preview);
 // 釋放原始大陣列，之後只留下小型學習模型。
 chunks=null;hourChunks=null;
 readingFiles=false;updateGenerateState();
});
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const base={road:56,arterial:61,rail:56,residential:48,mixed:53,industrial:57,construction:58,commercial:57,quiet:43};
function dayAdjFloat(hour,scene){const pts=[[0,-5.5],[4,-7],[5.5,-5],[7,1],[8.2,4.5],[10,2.2],[14,1.5],[16,2.5],[17.5,4.5],[19.5,2.2],[22,-1],[24,-5.5]];let a=pts[0][1];for(let i=1;i<pts.length;i++){if(hour<=pts[i][0]){let [x0,y0]=pts[i-1],[x1,y1]=pts[i];let t=(hour-x0)/(x1-x0);t=t*t*(3-2*t);a=y0+(y1-y0)*t;break}}if(scene==='residential'||scene==='quiet')a*=.72;if(scene==='commercial'&&hour>=10&&hour<=21)a+=1.8;return a}
function percentile(arr,p){let a=[...arr].sort((x,y)=>x-y);return a[Math.min(a.length-1,Math.floor((1-p)*a.length))]}
function stats(a){let leq=10*Math.log10(a.reduce((s,x)=>s+10**(x/10),0)/a.length);return{leq,max:Math.max(...a),l5:percentile(a,.05),l10:percentile(a,.10),l50:percentile(a,.50),l90:percentile(a,.90),l95:percentile(a,.95),min:Math.min(...a)}}
async function generate(){
 const s=new Date($('start').value),e=new Date($('end').value);if(!(e>s))return alert('結束時間要晚於開始時間');
 const n=Math.floor((e-s)/1000)+1;if(n>700000)return alert('瀏覽器版先限制約 8 天資料，避免手機記憶體不足。');if(mode==='learn'&&!learned)return alert('請先讀取舊 RND 資料');
 $('prog').classList.remove('hidden');$('bar').style.width='2%';$('result').classList.add('hidden');await new Promise(r=>setTimeout(r,10));
 startMs=s.getTime();endMs=e.getTime();values=new Float32Array(n);
 const scene=$('scene').value,str=Number($('strength').value),evRate=Number($('events').value||1),sim=Number($('similarity').value||.7),off=Number($('offset').value||0);
 let bg=mode==='learn'?learned.mean:(base[scene]+str),fast=0,medium=0,slow=0,micro=0,sumE=0,max=-Infinity,min=Infinity;
 let dayKey='',dayBias=0,dayTraffic=1,dayPhase=0,daySpread=1;
 const roadLike=scene==='arterial'||scene==='road'||scene==='mixed'||scene==='rail';
 const eventAdd=new Float32Array(n);
 function addEnvelope(pos,dur,amp,asym=.42,shape=1){
   let stop=Math.min(n,pos+dur);
   for(let j=pos;j<stop;j++){
     let x=(j-pos+1)/(dur+1);
     let y=x<asym?Math.pow(x/asym,1.08):Math.pow(Math.max(0,(1-x)/(1-asym)),1.32);
     eventAdd[j]+=amp*Math.pow(Math.max(0,y),shape);
   }
 }
 // V2.0: pre-schedule alternating traffic clusters and quiet gaps.
 if(mode!=='learn'){
   let t=0, busy=false, phaseLeft=0;
   while(t<n){
     let d=new Date(startMs+t*1000),h=d.getHours()+d.getMinutes()/60;
     let daylight=h>=6&&h<22;
     let rush=Math.exp(-1*Math.pow((h-8)/1.5,2))+Math.exp(-1*Math.pow((h-17.6)/1.7,2));
     let nightFactor=daylight?1:((h>=22||h<5)?.25:.52);
     let baseRate=(scene==='arterial'?.0035:scene==='road'?.0026:scene==='mixed'?.0021:scene==='rail'?.00135:scene==='commercial'?.0017:(scene==='industrial'||scene==='construction')?.0014:.00055);

     if(phaseLeft<=0){
       busy=!busy;
       // Busy periods are shorter; quiet periods can last several minutes.
       phaseLeft=busy ? 90+((Math.random()*330)|0) : 150+((Math.random()*650)|0);
       if(rush>.45 && Math.random()<.55){busy=true;phaseLeft=180+((Math.random()*420)|0)}
       if(!daylight && Math.random()<.60){busy=false;phaseLeft=300+((Math.random()*900)|0)}
     }

     let density=busy ? (.95+Math.random()*.85) : (.10+Math.random()*.20);
     let p=Math.max(.000025,baseRate*evRate*nightFactor*(1+.35*rush)*density);
     let gap=Math.max(1,Math.floor(-Math.log(Math.max(1e-9,Math.random()))/p));
     gap=Math.min(gap,phaseLeft);
     t+=gap;phaseLeft-=gap;if(t>=n)break;

     let r=Math.random(),dur,amp,shape,asym=.42;
     if(scene==='rail'&&Math.random()<.26){
       dur=55+((Math.random()*135)|0);amp=10+Math.random()*14;shape=.70+Math.random()*.40;asym=.22+Math.random()*.16;
     }else if(roadLike){
       if(r<.52){dur=7+((Math.random()*24)|0);amp=4.5+Math.random()*7.5;shape=.80+Math.random()*.46}
       else if(r<.88){dur=18+((Math.random()*58)|0);amp=6+Math.random()*10;shape=.84+Math.random()*.50}
       else{dur=42+((Math.random()*105)|0);amp=8+Math.random()*13;shape=.74+Math.random()*.46}
     }else{
       dur=9+((Math.random()*48)|0);amp=4+Math.random()*9;shape=.9+Math.random()*.55;
     }
     addEnvelope(t,dur,amp,asym,shape);

     // In a busy cluster, nearby vehicles often arrive in short groups.
     if(busy&&roadLike&&Math.random()<.38){
       let companions=1+((Math.random()*4)|0);
       for(let c=0;c<companions;c++){
         let pos=t+6+((Math.random()*75)|0);
         let cd=7+((Math.random()*42)|0),ca=3.5+Math.random()*8.5;
         if(pos<n)addEnvelope(pos,cd,ca,.36+Math.random()*.14,.82+Math.random()*.42);
       }
     }

     // Rare isolated large event, separated from normal traffic density.
     if(Math.random()<(daylight?.012:.004)){
       let pos=t+20+((Math.random()*180)|0);
       if(pos<n)addEnvelope(pos,30+((Math.random()*95)|0),9+Math.random()*13,.30+Math.random()*.16,.72+Math.random()*.40);
     }
   }
 }
 function refreshDay(d){
   let k=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
   if(k!==dayKey){dayKey=k;dayBias=randn()*1.05;dayTraffic=Math.max(.72,Math.min(1.32,1+randn()*.14));dayPhase=(Math.random()-.5)*1.15;daySpread=Math.max(.82,Math.min(1.28,1+randn()*.12));}
 }
 for(let i=0;i<n;i++){
   const ms=startMs+i*1000,d=new Date(ms),hour=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;refreshDay(d);
   let h2=(hour+dayPhase+24)%24;
   let target=mode==='learn'?(learned.hourProfile[d.getHours()]||learned.mean)+off:base[scene]+str+dayAdjFloat(h2,scene)+dayBias;
   let v;
   if(mode==='learn'){
     // Block-bootstrap old residual texture: long enough to preserve real clusters, with gentle synthetic drift.
     if(i===0||i%180===0)window._learnPos=(Math.random()*Math.max(1,learned.residuals.length-240))|0;
     let rr=learned.residuals[(window._learnPos+(i%180))%learned.residuals.length]||0;
     slow=.9994*slow+randn()*.025;medium=.994*medium+randn()*.055;fast=.72*fast+randn()*.16;
     let synthetic=slow+medium+fast+randn()*.10;
     v=target + rr*sim + synthetic*(1-sim)*2.2;
   }else{
     slow=.99955*slow+randn()*.050*daySpread;slow=Math.max(-4.8,Math.min(4.8,slow));
     medium=.9935*medium+randn()*.155*daySpread;medium=Math.max(-4.4,Math.min(4.4,medium));
     fast=.64*fast+randn()*.62*daySpread;fast=Math.max(-3.8,Math.min(3.8,fast));
     micro=.26*micro+randn()*.72*daySpread;
     bg+=(target-bg)*.00031+randn()*.026;
     v=bg+slow+medium+fast+micro+eventAdd[i]*dayTraffic;
     let daylight=hour>=6&&hour<22;
     if(Math.random()<(daylight?.000018:.000006)*evRate)v+=6+Math.random()*11;
   }
   v=Math.max(30,Math.min(scene==='rail'||scene==='arterial'?102:98,v));v=Math.round(v*10)/10;
   values[i]=v;sumE+=10**(v/10);if(v>max)max=v;if(v<min)min=v;
   if((i&32767)===0){$('bar').style.width=`${2+78*i/n}%`;await new Promise(r=>setTimeout(r,0));}
 }
  // V2.5：只優化 NL-52「舊數據學習」；NL-53 完全不進入這段。
  if($('model').value==='NL-52' && mode==='learn'){
    let days={}, drift=0, driftTarget=0, nextDrift=0;
    for(let i=0;i<n;i++){
      let d=new Date(startMs+i*1000), key=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
      if(!days[key]) days[key]={
        bias:(Math.random()*2-1)*1.15,
        night:(Math.random()*2-1)*.8,
        dawn:(Math.random()*2-1)*1.0,
        day:(Math.random()*2-1)*.75,
        eve:(Math.random()*2-1)*1.0
      };
      if(i>=nextDrift){driftTarget=(Math.random()*2-1)*.65;nextDrift=i+120+((Math.random()*360)|0)}
      drift+=(driftTarget-drift)*.0022;
      let h=d.getHours()+d.getMinutes()/60, sh=days[key], a,b,t;
      if(h<6){a=sh.night;b=sh.dawn;t=h/6}
      else if(h<10){a=sh.dawn;b=sh.day;t=(h-6)/4}
      else if(h<17){a=sh.day;b=sh.eve;t=(h-10)/7}
      else if(h<22){a=sh.eve;b=sh.night;t=(h-17)/5}
      else{a=sh.night;b=sh.night;t=0}
      t=(1-Math.cos(Math.PI*t))/2;
      let adj=sh.bias+a*(1-t)+b*t+drift;
      values[i]=Math.round(Math.max(30,Math.min(98,values[i]+adj))*10)/10;
    }
    // 少量平滑事件：讓不同天的車輛/生活事件位置不固定，但舊資料紋理仍是主體。
    let eventN=Math.round((n/3600)*(.28+Math.random()*.30));
    for(let e2=0;e2<eventN;e2++){
      let c=(Math.random()*n)|0, hh2=new Date(startMs+c*1000).getHours();
      if(hh2<6 && Math.random()<.82){e2--;continue}
      let half=4+((Math.random()*12)|0), amp=3+Math.random()*7.5;

    }

    sumE=0;max=-Infinity;min=Infinity;
    for(let i=0;i<n;i++){let v=values[i];sumE+=10**(v/10);if(v>max)max=v;if(v<min)min=v}
  }
