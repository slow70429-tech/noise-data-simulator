<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>噪音數據模擬助手 V1.1</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:18px}.head{background:#172554;color:white;border-radius:20px;padding:22px;box-shadow:0 8px 24px #17255422}.head h1{margin:0 0 6px;font-size:26px}.head p{margin:0;opacity:.85}.badge{display:inline-block;margin-top:12px;padding:5px 9px;border-radius:999px;background:#ffffff1c;font-size:12px}.card{background:white;border-radius:18px;padding:18px;margin-top:15px;box-shadow:0 5px 18px #17255412}.modegrid,.grid3,.grid2{display:grid;gap:12px}.modegrid{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr 1fr}.mode{border:2px solid #dbe3f0;background:#fff;border-radius:16px;padding:17px;text-align:left;cursor:pointer}.mode.active{border-color:#3157d5;background:#eef3ff}.mode b{font-size:17px;display:block;margin-bottom:4px}.mode small{color:#657089}label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}select,input{width:100%;border:1px solid #cad3e1;border-radius:11px;padding:12px;font-size:16px;background:white}.btn{border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:#3157d5;color:white}.secondary{background:#e9eef8;color:#23314d}.danger{background:#fff0f0;color:#a52626}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.hidden{display:none!important}.info{background:#f7f9fd;border:1px solid #e2e8f3;border-radius:12px;padding:12px;font-size:13px;color:#536079;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.stat{background:#f5f7fb;border-radius:12px;padding:11px}.stat span{display:block;font-size:11px;color:#788399}.stat b{font-size:17px}.tablewrap{overflow:auto;max-height:330px;border:1px solid #e3e8f1;border-radius:12px;margin-top:12px}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:8px 10px;border-bottom:1px solid #edf0f5;text-align:right}th{position:sticky;top:0;background:#f5f7fb}th:first-child,td:first-child{text-align:left}.progress{height:8px;background:#e7ecf5;border-radius:99px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;width:0;background:#3157d5}.warn{font-size:12px;color:#8a5a00;background:#fff7df;padding:10px;border-radius:10px;margin-top:12px}@media(max-width:680px){.modegrid,.grid3,.grid2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.wrap{padding:12px}.head h1{font-size:22px}}
</style></head>
<body><div class="wrap">
<section class="head"><h1>噪音數據模擬助手</h1><p>Noise Data Simulator · NL-53 / NL-52 / NL-32</p><span class="badge">V1.1 · 模擬／測試用途</span></section>
<section class="card"><div class="modegrid">
<button class="mode active" id="mNew" onclick="setMode('new')"><b>🎛️ 單獨產生</b><small>依場景與時段建立新的每秒 Lp</small></button>
<button class="mode" id="mLearn" onclick="setMode('learn')"><b>📂 讀取舊數據模擬</b><small>讀取舊 RND，學習波動後產生新資料</small></button>
</div></section>
<section class="card">
<div class="grid3"><div><label>儀器型號</label><select id="model"><option>NL-53</option><option>NL-52</option><option>NL-32</option></select></div><div><label>開始時間</label><input id="start" type="datetime-local" step="1"></div><div><label>結束時間</label><input id="end" type="datetime-local" step="1"></div></div>
<div id="newPanel"><div class="grid3"><div><label>環境場景</label><select id="scene"><option value="road">一般道路</option><option value="arterial">主要幹道／大馬路</option><option value="residential">住宅區</option><option value="mixed">住宅區＋道路</option><option value="industrial">工業區</option><option value="construction">工地周邊</option><option value="commercial">商業區／市區</option><option value="quiet">郊區／安靜地區</option></select></div><div><label>整體強度</label><select id="strength"><option value="-3">偏低</option><option value="0" selected>一般</option><option value="3">偏高</option></select></div><div><label>偶發事件</label><select id="events"><option value="0.5">少</option><option value="1" selected>一般</option><option value="1.7">多</option></select></div></div></div>
<div id="learnPanel" class="hidden"><label>舊數據 RND（可一次選多檔）</label><input id="files" type="file" multiple accept=".rnd,.RND,.txt,.TXT"><div class="grid2"><div><label>參考資料相似程度</label><select id="similarity"><option value="0.45">低</option><option value="0.7" selected>中</option><option value="0.9">高</option></select></div><div><label>新資料強度修正（dB）</label><input id="offset" type="number" value="0" min="-15" max="15" step="0.1"></div></div><div class="info" id="fileInfo">尚未讀取參考檔。</div></div>
<div class="warn">產出的檔案會標示為模擬／測試資料，適合流程測試、軟體驗證與演練，不應冒充實際儀器量測紀錄。</div>
<div class="row"><button class="btn primary" onclick="generate()">▶ 產生模擬資料</button><button class="btn secondary" onclick="clearAll()">清除</button></div><div class="progress hidden" id="prog"><i id="bar"></i></div>
</section>
<section class="card hidden" id="result"><h3 style="margin:0">結果預覽</h3><div class="stats"><div class="stat"><span>每秒筆數</span><b id="sCount">-</b></div><div class="stat"><span>總時數</span><b id="sHours">-</b></div><div class="stat"><span>整體 Leq</span><b id="sLeq">-</b></div><div class="stat"><span>最大值</span><b id="sMax">-</b></div></div><div class="tablewrap"><table><thead><tr><th>時間</th><th>Leq</th><th>Lmax</th><th>L5</th><th>L10</th><th>L50</th><th>L90</th><th>L95</th><th>Lmin</th></tr></thead><tbody id="hourRows"></tbody></table></div><div class="row"><button class="btn primary" onclick="downloadCSV()">下載每秒 CSV</button><button class="btn secondary" onclick="downloadInstrument()">下載儀器格式（測試）</button></div><div class="info" id="exportInfo"></div></section>
</div>
<script>
let mode='new', data=[], learned=null;
const $=id=>document.getElementById(id);function pad(n,w=2){return String(n).padStart(w,'0')}function dt(d){return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}
function setDefaults(){let n=new Date();n.setMinutes(0,0,0);$('start').value=new Date(n.getTime()-n.getTimezoneOffset()*60000).toISOString().slice(0,19);let e=new Date(n.getTime()+24*3600000);$('end').value=new Date(e.getTime()-e.getTimezoneOffset()*60000).toISOString().slice(0,19)}setDefaults();
function setMode(m){mode=m;$('mNew').classList.toggle('active',m==='new');$('mLearn').classList.toggle('active',m==='learn');$('newPanel').classList.toggle('hidden',m!=='new');$('learnPanel').classList.toggle('hidden',m!=='learn')}
$('files').addEventListener('change',async e=>{let vals=[];for(const f of e.target.files){let t=await f.text();for(const line of t.split(/\r?\n/)){let parts=line.split(',');let v=null;if(/^\s*\d+(\.\d+)?\s*,/.test(line)&&parts.length<=6)v=parseFloat(parts[0]);else if(parts.length>2&&/^\s*\d+\s*$/.test(parts[0]))v=parseFloat(parts[2]);if(Number.isFinite(v)&&v>15&&v<140)vals.push(v)}}if(vals.length<30){learned=null;$('fileInfo').textContent='找不到足夠的 Lp 數值，請確認是 NL-53／52／32 的 RND。';return}let dif=[];for(let i=1;i<vals.length;i++)dif.push(vals[i]-vals[i-1]);learned={vals,mean:vals.reduce((a,b)=>a+b,0)/vals.length,sd:Math.sqrt(vals.reduce((a,b)=>a+(b-(vals.reduce((x,y)=>x+y,0)/vals.length))**2,0)/vals.length),dif};$('fileInfo').textContent=`已讀取 ${e.target.files.length} 個檔案，共 ${vals.length.toLocaleString()} 筆 Lp；平均 ${learned.mean.toFixed(1)} dB，波動 SD ${learned.sd.toFixed(1)} dB。`});
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const base={road:56,arterial:61,residential:48,mixed:53,industrial:57,construction:58,commercial:57,quiet:43};
function dayAdj(h,scene){let a=0;if(h<5)a=-7;else if(h<7)a=-2;else if(h<9)a=5;else if(h<16)a=2;else if(h<19)a=5;else if(h<22)a=1;else a=-3;if(scene==='residential'||scene==='quiet')a*=.7;if(scene==='commercial'&&h>=10&&h<=21)a+=2;return a}
function percentile(arr,p){let a=[...arr].sort((x,y)=>x-y);return a[Math.min(a.length-1,Math.floor((1-p)*a.length))]}
function stats(a){let leq=10*Math.log10(a.reduce((s,x)=>s+10**(x/10),0)/a.length);return{leq,max:Math.max(...a),l5:percentile(a,.05),l10:percentile(a,.10),l50:percentile(a,.50),l90:percentile(a,.90),l95:percentile(a,.95),min:Math.min(...a)}}
async function generate(){
 let s=new Date($('start').value),e=new Date($('end').value);if(!(e>s))return alert('結束時間要晚於開始時間');
 let n=Math.floor((e-s)/1000)+1;if(n>700000)return alert('V1.1 瀏覽器版先限制約 8 天資料，避免手機記憶體不足。');if(mode==='learn'&&!learned)return alert('請先讀取舊 RND 資料');
 $('prog').classList.remove('hidden');$('bar').style.width='2%';$('result').classList.add('hidden');await new Promise(r=>setTimeout(r,20));
 data=new Array(n);let scene=$('scene').value,str=Number($('strength').value),evRate=Number($('events').value||1),sim=Number($('similarity').value||.7);
 let bg=mode==='learn'?learned.mean:(base[scene]+str), event=null, micro=0;
 for(let i=0;i<n;i++){
   let t=new Date(s.getTime()+i*1000),v;
   if(mode==='learn'){
     let d=learned.dif[Math.floor(Math.random()*learned.dif.length)]||0;
     d=Math.max(-3.5,Math.min(3.5,d));
     let target=learned.mean+Number($('offset').value)+dayAdj(t.getHours(),'road')*.10*(1-sim);
     bg+=(target-bg)*.004+d*sim*.20+randn()*.10;
     v=bg;
     if(Math.random()<0.0015*(1-sim)){v+=Math.max(-4,Math.min(8,randn()*learned.sd*.35));}
   }else{
     let target=base[scene]+str+dayAdj(t.getHours(),scene);
     micro=.88*micro+randn()*.32;
     bg+=(target-bg)*.008+randn()*.10;
     v=bg+micro;
     if(!event){
       let p=(scene==='arterial'?0.0028:scene==='road'||scene==='mixed'?0.0022:scene==='commercial'?0.0018:scene==='industrial'||scene==='construction'?0.0015:0.0008)*evRate;
       if(Math.random()<p){let dur=scene==='arterial'||scene==='road'||scene==='mixed'?8+Math.floor(Math.random()*22):5+Math.floor(Math.random()*18);let amp=(scene==='arterial'?8:scene==='road'||scene==='mixed'?7:5)+Math.random()*(scene==='arterial'?7:6);event={age:0,dur,amp};}
     }
     if(event){let x=(event.age+1)/(event.dur+1),shape=Math.sin(Math.PI*x);v+=event.amp*Math.pow(shape,.75);event.age++;if(event.age>=event.dur)event=null;}
     if(Math.random()<0.000035*evRate)v+=5+Math.random()*8;
   }
   v=Math.max(30,Math.min(100,v));data[i]={t,v:+v.toFixed(1)};
   if(i%12000===0){$('bar').style.width=`${2+82*i/n}%`;await new Promise(r=>setTimeout(r,0));}
 }
 $('bar').style.width='88%';await new Promise(r=>setTimeout(r,0));render();$('bar').style.width='100%';setTimeout(()=>$('prog').classList.add('hidden'),450)
}
function render(){$('result').classList.remove('hidden');$('sCount').textContent=data.length.toLocaleString();$('sHours').textContent=(data.length/3600).toFixed(1);let all=stats(data.map(x=>x.v));$('sLeq').textContent=all.leq.toFixed(1)+' dB';$('sMax').textContent=all.max.toFixed(1)+' dB';let groups=new Map();for(const x of data){let d=x.t,k=`${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:00`;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x.v)}$('hourRows').innerHTML=[...groups].map(([k,a])=>{let z=stats(a),f=x=>x.toFixed(1);return `<tr><td>${k}</td><td>${f(z.leq)}</td><td>${f(z.max)}</td><td>${f(z.l5)}</td><td>${f(z.l10)}</td><td>${f(z.l50)}</td><td>${f(z.l90)}</td><td>${f(z.l95)}</td><td>${f(z.min)}</td></tr>`}).join('');$('exportInfo').textContent=`目前選擇 ${$('model').value}。NL-53 會依每小時 3,600 筆切檔，對應你實際看到的 Auto_Lp_01 多檔結構；測試輸出仍保留 SIMULATED_TEST 標示。`}
function blobDownload(text,name){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function downloadCSV(){if(!data.length)return;blobDownload('SIMULATED_TEST_DATA\nTime,Lp_dB\n'+data.map(x=>`${dt(x.t)},${x.v.toFixed(1)}`).join('\n'),'noise_simulated_per_second.csv')}
function downloadInstrument(){if(!data.length)return;let m=$('model').value;if(m==='NL-32'){let chunk=60000;for(let c=0;c<data.length;c+=chunk){let txt='SIMULATED_TEST_DATA,DO_NOT_USE_AS_MEASUREMENT\r\n'+data.slice(c,c+chunk).map(x=>` ${x.v.toFixed(1)}, , , ,`).join('\r\n');blobDownload(txt,`SIM_AU1_${pad(c/chunk,4)}.RND`)}}else if(m==='NL-52'){let chunk=36000;for(let c=0;c<data.length;c+=chunk){let txt='SIMULATED_TEST_DATA,DO_NOT_USE_AS_MEASUREMENT\r\nAddress,Start Time,Lp,Over,Under,Output Over,Marker 1,Marker 2,\r\n'+data.slice(c,c+chunk).map((x,j)=>`${String(c+j+1).padStart(9)},${dt(x.t)}.0, ${x.v.toFixed(1)},----,-----,--------,-,-,`).join('\r\n');blobDownload(txt,`SIM_NL52_${pad(c/chunk+1,4)}.rnd`)}}else{let chunk=3600;for(let c=0;c<data.length;c+=chunk){let slice=data.slice(c,c+chunk),runMax=-Infinity,runMin=Infinity,sumE=0;let lines=slice.map((x,j)=>{runMax=Math.max(runMax,x.v);runMin=Math.min(runMin,x.v);sumE+=10**(x.v/10);let leq=10*Math.log10(sumE/(j+1)),peak=x.v+3+Math.random()*.4;return `${String(c+j+1).padStart(11)},${dt(x.t)}.600, ${x.v.toFixed(1)}, ${leq.toFixed(1)}, ${runMax.toFixed(1)}, ${runMin.toFixed(1)}, ${peak.toFixed(1)},  -.-,-,-,-,-,-,-,`});let txt='SIMULATED_TEST_DATA,DO_NOT_USE_AS_MEASUREMENT\r\nAddress,Start Time,Lp(Main),Leq(Main),Lmax(Main),Lmin(Main),Lpeak(Main),LIeq(Main),Over(Main),Under(Main),Marker1,Marker2,Marker3,Marker4,\r\n'+lines.join('\r\n');blobDownload(txt,`SIM_NL53_${pad(c/chunk+1,4)}.rnd`)}}}
function clearAll(){data=[];learned=null;$('files').value='';$('fileInfo').textContent='尚未讀取參考檔。';$('result').classList.add('hidden');setDefaults()}
</script></body></html>
